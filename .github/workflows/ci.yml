name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify dist/ is up to date
        run: |
          git diff --exit-code -- dist/ || (echo "dist/ is stale: run npm run build and commit" && exit 1)

  integration:
    runs-on: ubuntu-latest
    services:
      wiremock:
        image: wiremock/wiremock:3.9.1
        ports: ['8080:8080']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Load the simulator mappings
        run: |
          for file in test/wiremock/mappings/*.json; do
            curl -sS -X POST --data-binary "@$file" http://localhost:8080/__admin/mappings > /dev/null
          done
      - run: npm run test:integration
